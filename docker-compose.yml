version: "3.8"

services:
  onetab-lite-vault:
    build: .
    container_name: onetab-lite-vault
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      - PORT=8787
      - DATA_DIR=/app/data
      - VAULT_TOKEN=${VAULT_TOKEN:-}
    volumes:
      - onetab_data:/app/data

volumes:
  onetab_data:
